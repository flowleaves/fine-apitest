<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>星芽 · 测试结果</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%235eead4'/%3E%3Cstop offset='1' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230b1220'/%3E%3Cpath d='M32 9l5.6 16.4L54 31l-16.4 5.6L32 53l-5.6-16.4L10 31l16.4-5.6z' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="/" aria-label="星芽测试结果首页">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" role="img">
        <defs>
          <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#5eead4"></stop>
            <stop offset="1" stop-color="#60a5fa"></stop>
          </linearGradient>
        </defs>
        <path d="M32 6l6.2 18.2L56 31l-17.8 6.8L32 56l-6.2-18.2L8 31l17.8-6.8z" fill="url(#brandGradient)"></path>
      </svg>
    </span>
    <span class="brand-text">
      <strong>星芽</strong>
      <small>模型能力测试</small>
    </span>
  </a>
  <div class="top-actions">
    <button class="icon-btn" id="theme-btn" type="button" title="切换明暗主题" aria-label="切换明暗主题">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M3 12h2m14 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"></circle></svg>
    </button>
    <button class="btn btn-ghost" id="refresh-btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      刷新
    </button>
  </div>
</header>

<main class="shell">
  <section class="hero">
    <div class="hero-copy">
      <span class="eyebrow">RELAY CAPABILITY REPORT</span>
      <h1>模型能力测试结果</h1>
      <p>糖果推理 · 模型指纹 · 水豚海滩 HTML</p>
    </div>
    <div class="hero-stats" id="hero-stats" aria-label="总体统计">
      <div class="stat"><span>站点分组</span><strong id="stat-groups">—</strong></div>
      <div class="stat"><span>模型</span><strong id="stat-models">—</strong></div>
      <div class="stat stat-pass"><span>通过</span><strong id="stat-pass">—</strong></div>
      <div class="stat stat-review"><span>待复核</span><strong id="stat-review">—</strong></div>
      <div class="stat stat-fail"><span>不通过</span><strong id="stat-fail">—</strong></div>
    </div>
  </section>

  <section class="toolbar" aria-label="筛选与操作">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
      <input id="search" type="search" placeholder="搜索模型，例如 opus / gpt" autocomplete="off" aria-label="搜索模型">
    </label>
    <select id="verdict-filter" aria-label="按总评筛选">
      <option value="all">全部总评</option>
      <option value="pass">通过</option>
      <option value="review">待复核</option>
      <option value="fail">不通过</option>
    </select>
    <div class="toolbar-actions">
      <button class="btn btn-ghost" id="expand-btn" type="button">展开模型</button>
      <button class="btn btn-ghost" id="collapse-btn" type="button">收起模型</button>
    </div>
  </section>

  <div class="result-meta" id="result-meta"></div>
  <div id="groups" class="groups" aria-live="polite">
    <div class="loading-panel">
      <div class="skeleton-line w40"></div>
      <div class="skeleton-line w70"></div>
      <div class="skeleton-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </div>
  <div id="filter-empty" class="empty" hidden>
    <div class="icon">⌕</div>
    <h3>没有匹配的模型</h3>
    <p>试试清除搜索关键词，或切换总评筛选。</p>
    <button class="btn btn-ghost" type="button" data-action="clear-filters">清除筛选</button>
  </div>
</main>

<footer class="footer">
  <span>数据来自本地 <code>data/</code> · 只读</span>
  <span>fine-apitest 0.2.0</span>
</footer>

<div id="toast" class="toast" role="status" hidden></div>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-action="close-modal"></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div>
        <span class="eyebrow">HTML PREVIEW</span>
        <h2 id="modal-title">水豚 HTML</h2>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-download" type="button">下载 HTML</button>
        <button class="btn btn-primary" id="modal-close" type="button">关闭</button>
      </div>
    </div>
    <iframe id="modal-frame" sandbox="allow-scripts" referrerpolicy="no-referrer" title="HTML 全屏预览"></iframe>
  </div>
</div>

<noscript>
  <div class="noscript">结果页需要启用 JavaScript。</div>
</noscript>
</body>
</html>
